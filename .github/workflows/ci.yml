name: MatchBench checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matchbench
          POSTGRES_PASSWORD: matchbench-ci
          POSTGRES_DB: matchbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchbench"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://matchbench:matchbench-ci@localhost:5432/matchbench
      TEST_DATABASE_URL: postgresql+psycopg://matchbench:matchbench-ci@localhost:5432/matchbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install '.[dev]'
      - run: ruff check matchbench migrations tests
      - run: mypy matchbench
      - run: alembic upgrade head
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
