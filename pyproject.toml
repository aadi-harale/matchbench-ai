[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matchbench"
version = "0.1.0"
description = "Explainable job retrieval, ranking and evaluation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "pgvector>=0.3,<1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "pypdf>=6,<7", "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1", "pyjwt>=2.10,<3", "argon2-cffi>=23,<26",
  "httpx>=0.28,<1", "bm25s>=0.2,<0.4", "numpy>=2,<3", "scipy>=1.14,<2",
  "onnxruntime>=1.21,<2", "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools]
packages = ["matchbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
